name: "Test setup-nuget-exe"

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        nuget-version: ${{ github.actor == 'dependabot[bot]' && fromJSON('["latest"]') || fromJSON('["latest", "preview"]') }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - run: npm ci
    - run: npm run build
    - run: npm test
    - uses: ./
      with:
        nuget-version: ${{ matrix.nuget-version }}
    - run: nuget
